# Docker Compose v2 / Docker Standalone. HTTP 8083 redirects to HTTPS 8443.
services:
  app:
    image: ${APP_IMAGE:-localhost/wazuh-security-reports-app:0.4.3}
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${REPORT_DOMAIN:?Configure o host da aplicacao no .env}:8443
      INDEXER_IP: ${INDEXER_IP:?Defina INDEXER_IP no .env}
      INDEXER_PORT: ${INDEXER_PORT:-9200}
      INDEXER_USER: ${INDEXER_USER:?Defina INDEXER_USER no .env}
      INDEXER_PASSWORD: ${INDEXER_PASSWORD:?Defina INDEXER_PASSWORD no .env}
      TRUST_PROXY: '1'
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
      # For a private CA, see deploy/README.md; do not disable TLS validation.
    volumes:
      - reports_data:/data
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 134217728
          mode: 01777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/healthz',headers={'Host':os.environ['PUBLIC_ORIGIN'].split('://')[1],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  proxy:
    image: ${PROXY_IMAGE:-localhost/wazuh-security-reports-proxy:0.4.3}
    build:
      context: .
      dockerfile: deploy/Dockerfile.proxy
    restart: unless-stopped
    environment:
      REPORT_DOMAIN: ${REPORT_DOMAIN:?Defina REPORT_DOMAIN no .env}
      REPORT_HTTPS_PORT: "8443"
    ports:
      - '8083:8080'
      - '8443:8443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216
          mode: 01777
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      app:
        condition: service_healthy
volumes:
  reports_data:
  caddy_data:
  caddy_config:
