<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Relatórios de Segurança</title><link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml"><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body><header><a class="brand" href="{{ url_for('dashboard') }}"><img src="{{ url_for('static', filename='icon.svg') }}" alt="" width="42" height="42"><span>Relatórios de Segurança<small>CONFIDENCIAL · Portal de análise</small></span></a>{% if g.user %}<form action="{{ url_for('logout') }}" method="post"><input type="hidden" name="csrf" value="{{ g.session.csrf }}"><span>{{ g.user.username }}</span> <button class="secondary" type="submit">Sair</button></form>{% endif %}</header>
<main>{% block content %}{% endblock %}</main><footer>Informações confidenciais · Compartilhe os relatórios somente com pessoas autorizadas.</footer></body></html>
